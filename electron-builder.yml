appId: com.bodhi.editor
productName: Bodhi Code Editor
npmRebuild: false
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources
    to: resources
asar: true
asarUnpack:
  - node_modules/node-pty/**/*

win:
  executableName: BodhiCodeEditor
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
    - target: zip
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Bodhi Code Editor
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  artifactName: "Bodhi Code Editor Setup ${version}.${ext}"
  license: resources/TERMS.txt

portable:
  artifactName: "Bodhi Code Editor ${version} Portable.${ext}"
